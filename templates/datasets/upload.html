{% extends 'base.html' %}

{% block title %}Upload — DataExplorer{% endblock %}

{% block content %}
    <h1 class="h3 mb-3">Upload a dataset</h1>

    <form method="post" enctype="multipart/form-data" class="col-md-6">
        {% csrf_token %}

        {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors|join:', ' }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary">Upload</button>
        <a href="{% url 'dataset_list' %}" class="btn btn-link">Cancel</a>
    </form>
{% endblock %}
